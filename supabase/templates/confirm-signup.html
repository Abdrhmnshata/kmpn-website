<!--
  Supabase → Authentication → Emails → "Confirm sign up".
  Subject: أكّد بريدك لبوابة عملاء كامبين

  The link uses token_hash (not the default {{ .ConfirmationURL }}) so it
  signs the client in from any browser. {{ .RedirectTo }} is the app's
  /auth/callback?next=… URL (local, preview or live), so it already has a "?".
-->
<div dir="rtl" style="margin:0;padding:24px 12px;background:#faf7f2;font-family:Tahoma,Arial,sans-serif;color:#0b0b0b;text-align:right">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:20px">
    <tr>
      <td style="padding:32px 28px">
        <a href="https://kmpn.agency" style="display:inline-block;margin:0 0 24px"><img src="https://kmpn.agency/assets/email/kmpn-logo-ar.png" width="120" height="45" alt="KMPN" style="display:block;border:0;width:120px;height:45px"></a>
        <h1 style="margin:0 0 12px;font-size:22px;line-height:1.5">أهلًا بك في بوابة عملاء كامبين</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.9;color:#4a463e">
          اضغط على الزر لتأكيد بريدك الإلكتروني وتفعيل حسابك، لتتابع بعدها مشاريعك وفواتيرك وتذاكر الدعم من مكان واحد.
        </p>
        <p style="margin:0 0 28px">
          <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
             style="display:inline-block;background:#ee4037;color:#ffffff;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 28px;border-radius:999px">
            تأكيد البريد الإلكتروني
          </a>
        </p>
        <p style="margin:0;font-size:13px;line-height:1.8;color:#6e685c">
          إذا لم تطلب إنشاء حساب، تجاهل هذه الرسالة.
        </p>
      </td>
    </tr>
  </table>
  <p style="max-width:520px;margin:16px auto 0;font-size:12px;color:#6e685c;text-align:center">كامبين · kmpn.agency</p>
</div>
